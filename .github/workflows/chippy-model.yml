name: Chippy model
# Prices upcoming games with the Chippy model every 6 hours and saves the output to the model-data branch,
# where the ChippyTips website reads it. Data: nflverse (CC-BY 4.0).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - run: python nfl_model.py
      - run: |
          git config user.name "chippy-model"
          git config user.email "chippy-model@users.noreply.github.com"
          git add nfl.json
          git diff --cached --quiet || git commit -m "Chippy model prices $(date -u +%FT%H:%MZ)"
          git push
