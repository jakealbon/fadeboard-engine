name: Chippy NHL skaters
# Skater game logs (who played, ice time) for the Chippy model's lineup layer. Saves nhl_skaters.json to the model-data branch.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python nhl_skaters.py
      - run: |
          git config user.name "chippy-model"
          git config user.email "chippy-model@users.noreply.github.com"
          git add nhl_skaters.json
          git diff --cached --quiet || git commit -m "NHL skaters $(date -u +%F)"
          git push
